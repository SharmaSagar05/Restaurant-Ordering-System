spring:
  datasource:
    url: jdbc:h2:mem:restaurant_test;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  thymeleaf:
    cache: false

app:
  jwt:
    secret: TestJwtSecretKeyMustBeAtLeast256BitsLongForHS256Algorithm!!
    expiration-ms: 3600000
  seed:
    enabled: false
