<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${formTitle} + ' · Sagar's Restaurant'">Menu item</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header th:replace="~{fragments :: topbar}"></header>
<main class="page">
    <div th:replace="~{fragments :: flash}"></div>
    <h1 th:text="${formTitle}">Menu item</h1>
    <form th:action="@{${formAction}}" th:object="${menuItemRequest}" method="post" class="stack form-narrow">
        <label>Name
            <input type="text" th:field="*{name}" required>
            <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </label>
        <label>Description
            <textarea th:field="*{description}" rows="4"></textarea>
        </label>
        <label>Price (₹)
            <input type="number" step="0.01" min="0.01" th:field="*{price}" required>
            <span class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
        </label>
        <label>Available quantity
            <input type="number" min="0" th:field="*{availableQuantity}" required>
            <span class="field-error" th:if="${#fields.hasErrors('availableQuantity')}" th:errors="*{availableQuantity}"></span>
        </label>
        <label class="checkbox">
            <input type="checkbox" th:field="*{active}">
            Active
        </label>
        <button type="submit" class="primary">Save</button>
    </form>
</main>
</body>
</html>
