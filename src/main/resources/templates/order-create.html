<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create order · Sagar's Restaurant</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header th:replace="~{fragments :: topbar}"></header>
<main class="page">
    <div th:replace="~{fragments :: flash}"></div>
    <div class="hero">
        <div>
            <h1>Create order</h1>
            <p class="muted">Choose quantities. Totals are calculated on the server.</p>
        </div>
        <form method="get" th:action="@{/order/create}" class="search">
            <input type="search" name="q" th:value="${q}" placeholder="Search menu items">
            <button type="submit">Search</button>
        </form>
    </div>
    <form th:action="@{/order/create}" method="post" id="order-form">
        <div class="grid">
            <article class="card" th:each="item : ${menuItems}">
                <h2 th:text="${item.name}">Pizza</h2>
                <p class="muted" th:text="${item.description}">Description</p>
                <p class="price">₹<span class="unit-price" th:text="${item.price}">250</span></p>
                <p class="stock">Available: <span th:text="${item.availableQuantity}">10</span></p>
                <label>Quantity
                    <input type="number" min="0" th:max="${item.availableQuantity}" value="0"
                           th:name="'qty_' + ${item.id}" class="qty-input" th:attr="data-price=${item.price}">
                </label>
            </article>
        </div>
        <div class="totals-bar">
            <strong>Estimated total: ₹<span id="estimated-total">0.00</span></strong>
            <button type="submit" class="primary">Place order</button>
        </div>
    </form>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
