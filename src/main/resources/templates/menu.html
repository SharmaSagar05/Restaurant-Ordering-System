<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menu · Sagar's Restaurant</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header th:replace="~{fragments :: topbar}"></header>
<main class="page">
    <div th:replace="~{fragments :: flash}"></div>
    <div class="hero">
        <div>
            <h1>Today's Menu</h1>
            <p class="muted">Fresh plates, priced in ₹. Availability is checked when you place an order.</p>
        </div>
        <form method="get" th:action="@{/menu}" class="search">
            <input type="search" name="q" th:value="${q}" placeholder="Search menu items">
            <button type="submit">Search</button>
        </form>
    </div>
    <div class="grid">
        <article class="card" th:each="item : ${menuItems}">
            <h2 th:text="${item.name}">Pizza</h2>
            <p class="muted" th:text="${item.description}">Description</p>
            <p class="price">₹<span th:text="${item.price}">250</span></p>
            <p class="stock" th:text="'Available: ' + ${item.availableQuantity}">Available: 10</p>
            <a sec:authorize="hasRole('CUSTOMER')" class="primary" th:href="@{/order/create}">Order now</a>
        </article>
    </div>
    <p th:if="${#lists.isEmpty(menuItems)}" class="muted">No menu items match that search.</p>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
